<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset password — Trade RC</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #faf7f2;
      --surface: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #5b2a86;
      --accent-text: #ffffff;
      --error: #c8102e;
      --success: #006c2c;
      --border: #e0dcd5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --surface: #2c2c2e;
        --text: #f5f5f7;
        --text-secondary: #98989d;
        --accent: #b380e6;
        --accent-text: #1c1c1e;
        --border: #3a3a3c;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px;
      line-height: 1.4;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: 16px;
      padding: 32px 24px;
      border: 1px solid var(--border);
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p.lede {
      color: var(--text-secondary);
      margin: 0 0 24px;
      font-size: 15px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      margin-bottom: 16px;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      font-weight: 600;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      min-height: 50px;
      -webkit-appearance: none;
      appearance: none;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
    }
    .status.error {
      background: rgba(200, 16, 46, 0.1);
      color: var(--error);
    }
    .status.success {
      background: rgba(0, 108, 44, 0.1);
      color: var(--success);
    }
    .hidden { display: none; }
    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <p class="lede" id="lede">Enter a new password for your Trade RC account. Must be at least 8 characters.</p>

    <form id="form" novalidate>
      <label for="password">New password</label>
      <input type="password" id="password" autocomplete="new-password" minlength="8" required>

      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" autocomplete="new-password" minlength="8" required>

      <button type="submit" id="submit">Update password</button>
    </form>

    <div id="status" class="status hidden" role="alert" aria-live="polite"></div>

    <footer>Thomas Ray Publishing LLC</footer>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://nzflkswaeqlciqvwvvug.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56Zmxrc3dhZXFsY2lxdnd2dnVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDI4NDUsImV4cCI6MjA5NDUxODg0NX0.QGrfTJaZLu1gFysjkc-04OnuErUu2gWmBIOwL8W16iM';

    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: false, persistSession: false, autoRefreshToken: false }
    });

    const form = document.getElementById('form');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const submitButton = document.getElementById('submit');
    const statusEl = document.getElementById('status');
    const ledeEl = document.getElementById('lede');

    function showStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = 'status ' + kind;
    }

    function clearStatus() {
      statusEl.textContent = '';
      statusEl.className = 'status hidden';
    }

    function lockForm(reason) {
      passwordInput.disabled = true;
      confirmInput.disabled = true;
      submitButton.disabled = true;
      if (reason) { ledeEl.textContent = reason; }
    }

    // Supabase recovery URLs land here as:
    //   .../reset-password.html#access_token=...&refresh_token=...&type=recovery
    // ...or with ?error=...&error_description=... if the token expired/was reused.
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const queryParams = new URLSearchParams(window.location.search);
    const accessToken = hashParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token');
    const type = hashParams.get('type');
    const errorCode = hashParams.get('error') || queryParams.get('error');
    const errorDescription = hashParams.get('error_description') || queryParams.get('error_description');

    if (errorCode || errorDescription) {
      lockForm('This reset link is invalid or has expired. Request a new one in the Trade RC app.');
      showStatus(decodeURIComponent(errorDescription || errorCode), 'error');
    } else if (!accessToken || type !== 'recovery') {
      lockForm('This page only works when opened from a Trade RC password reset email.');
    } else {
      client.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken || ''
      }).then(({ error }) => {
        if (error) {
          lockForm('Could not validate reset link. Request a new one in the Trade RC app.');
          showStatus(error.message || 'Session setup failed.', 'error');
        }
      }).catch((err) => {
        lockForm('Could not validate reset link. Request a new one in the Trade RC app.');
        showStatus(err.message || 'Session setup failed.', 'error');
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearStatus();

      const password = passwordInput.value;
      const confirm = confirmInput.value;

      if (password.length < 8) {
        showStatus('Password must be at least 8 characters.', 'error');
        return;
      }
      if (password !== confirm) {
        showStatus('Passwords do not match.', 'error');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Updating…';

      try {
        const { error } = await client.auth.updateUser({ password });
        if (error) {
          submitButton.disabled = false;
          submitButton.textContent = 'Update password';
          showStatus(error.message || 'Could not update password.', 'error');
          return;
        }
        lockForm('Password updated successfully.');
        showStatus('Your password has been updated. Return to the Trade RC app and sign in.', 'success');
        submitButton.textContent = 'Done';
      } catch (err) {
        submitButton.disabled = false;
        submitButton.textContent = 'Update password';
        showStatus(err.message || 'Unexpected error. Try again.', 'error');
      }
    });
  </script>
</body>
</html>
