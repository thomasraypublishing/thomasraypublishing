<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://nzflkswaeqlciqvwvvug.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Reset password — Trade RC</title>
  <meta name="theme-color" content="#1F0A28">
  <link rel="icon" type="image/png" href="trade-rc/images/icon.png">
  <link rel="apple-touch-icon" href="trade-rc/images/icon.png">
  <link rel="preload" href="assets/fonts/jetbrains-mono-normal-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-tight-normal-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="trade-rc/trade-rc.css">
  <style>
    .calm-main {
      max-width: 460px;
    }
    #reset-h {
      margin-bottom: 8px;
    }
    .lede {
      color: var(--trc-ink-2);
      margin: 0 0 28px;
      font-size: 0.9375rem;
    }
    #submit {
      width: 100%;
      margin-top: 4px;
    }
    #submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 4px;
      font-size: 0.875rem;
      font-family: var(--mono);
    }
    .status.error {
      background: rgba(255, 31, 143, 0.12);
      color: #FF9DCB;
      border: 1px solid rgba(255, 31, 143, 0.4);
    }
    .status.success {
      background: rgba(92, 184, 138, 0.12);
      color: var(--trc-sage);
      border: 1px solid rgba(92, 184, 138, 0.4);
    }
    .status.hidden {
      display: none;
    }
    .debug {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 4px;
      font-size: 0.6875rem;
      font-family: var(--mono);
      background: var(--trc-midnight);
      color: var(--trc-ink-2);
      border: 1px solid var(--trc-rule-mid);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .hidden {
      display: none;
    }
    a.return-link {
      display: block;
      margin-top: 16px;
      padding: 13px 16px;
      min-height: 48px;
      background: var(--trc-acid);
      color: var(--trc-btn-ink);
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.9375rem;
      text-align: center;
      text-decoration: none;
      border-radius: 4px;
      box-shadow: 0 0 24px var(--trc-acid-glow);
    }
    a.return-link:hover {
      background: #93FF82;
      color: var(--trc-btn-ink);
    }
    a.return-link.hidden {
      display: none;
    }
    .reset-foot {
      margin-top: 48px;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.03em;
      color: var(--trc-ink-2);
    }
  </style>
</head>
<body class="trc-calm">

<a class="skip-link" href="#reset-h">Skip to content</a>

<header class="mast">
  <a class="mark" href="trade-rc/index.html" aria-label="Trade RC home">
    <img src="trade-rc/images/icon.png" alt="" width="28" height="28">
    <span>Trade RC</span>
  </a>
</header>

<main class="calm-main" id="top">
  <h1 id="reset-h">Reset your password</h1>
  <p class="lede" id="lede">Validating reset link…</p>

  <form id="form" novalidate class="trc-field">
    <label for="password">New password</label>
    <input type="password" id="password" autocomplete="new-password" minlength="8" disabled required>

    <label for="confirm">Confirm new password</label>
    <input type="password" id="confirm" autocomplete="new-password" minlength="8" disabled required>

    <button type="submit" id="submit" class="btn btn-acid" disabled>Update password</button>
  </form>

  <div id="status" class="status hidden" role="alert" aria-live="polite"></div>
  <a id="returnLink" href="traderc://" class="return-link hidden">Return to Trade RC</a>
  <pre id="debug" class="debug hidden"></pre>

  <p class="reset-foot">Thomas Ray Publishing LLC</p>
</main>

<script src="assets/vendor/supabase-js-2.110.2.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://nzflkswaeqlciqvwvvug.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56Zmxrc3dhZXFsY2lxdnd2dnVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDI4NDUsImV4cCI6MjA5NDUxODg0NX0.QGrfTJaZLu1gFysjkc-04OnuErUu2gWmBIOwL8W16iM';

    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        detectSessionInUrl: true,
        persistSession: false,
        autoRefreshToken: false,
        flowType: 'implicit'
      }
    });

    const form = document.getElementById('form');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const submitButton = document.getElementById('submit');
    const statusEl = document.getElementById('status');
    const ledeEl = document.getElementById('lede');
    const debugEl = document.getElementById('debug');
    const returnLink = document.getElementById('returnLink');

    // Snapshot URL at load — detectSessionInUrl will scrub the auth params
    // after processing, so we need this for the fallback paths + diagnostic
    // info to remain useful.
    const urlAtLoad = window.location.href;
    const hashAtLoad = window.location.hash;
    const queryAtLoad = window.location.search;

    function showStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = 'status ' + kind;
    }

    function clearStatus() {
      statusEl.textContent = '';
      statusEl.className = 'status hidden';
    }

    function unlockForm() {
      passwordInput.disabled = false;
      confirmInput.disabled = false;
      submitButton.disabled = false;
      ledeEl.textContent = 'Enter a new password for your Trade RC account. Must be at least 8 characters.';
    }

    function lockWithReason(reason, showDebug) {
      passwordInput.disabled = true;
      confirmInput.disabled = true;
      submitButton.disabled = true;
      ledeEl.textContent = reason;
      if (showDebug) {
        debugEl.textContent =
          'URL on load:\n' + urlAtLoad +
          '\n\nHash: ' + (hashAtLoad || '(none)') +
          '\nQuery: ' + (queryAtLoad || '(none)');
        debugEl.classList.remove('hidden');
      }
    }

    let handled = false;

    function markHandledAndUnlock() {
      if (handled) return;
      handled = true;
      unlockForm();
      clearStatus();
    }

    function markHandledAndLock(reason, showDebug) {
      if (handled) return;
      handled = true;
      lockWithReason(reason, showDebug);
    }

    // The SDK with detectSessionInUrl: true will parse the URL and emit
    // either PASSWORD_RECOVERY (recovery link) or SIGNED_IN. If the URL
    // has no auth params, it emits INITIAL_SESSION with session=null.
    client.auth.onAuthStateChange(function (event, session) {
      console.log('[reset] auth event:', event, 'hasSession:', !!session);
      if (handled) return;
      if (event === 'PASSWORD_RECOVERY') {
        markHandledAndUnlock();
      } else if (event === 'SIGNED_IN' && session) {
        // Recovery session lands as SIGNED_IN in some SDK configs
        markHandledAndUnlock();
      } else if (event === 'INITIAL_SESSION' && !session) {
        // SDK saw no usable auth params in URL — try manual paths
        tryManualFlows();
      }
    });

    async function tryManualFlows() {
      if (handled) return;

      const hashParams = new URLSearchParams(hashAtLoad.substring(1));
      const queryParams = new URLSearchParams(queryAtLoad);

      const errorDescription =
        hashParams.get('error_description') || queryParams.get('error_description');
      if (errorDescription) {
        markHandledAndLock(
          'This reset link is invalid or has expired. Request a new one in the Trade RC app.',
          false
        );
        showStatus(decodeURIComponent(errorDescription), 'error');
        return;
      }

      // PKCE flow: ?code=...
      const code = queryParams.get('code');
      if (code) {
        try {
          const { error } = await client.auth.exchangeCodeForSession(code);
          if (!error) { markHandledAndUnlock(); return; }
          console.warn('[reset] exchangeCodeForSession failed:', error);
        } catch (err) {
          console.warn('[reset] exchangeCodeForSession threw:', err);
        }
      }

      // Implicit flow: #access_token=...
      const accessToken = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');
      if (accessToken) {
        try {
          const { error } = await client.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken || ''
          });
          if (!error) { markHandledAndUnlock(); return; }
          console.warn('[reset] setSession failed:', error);
        } catch (err) {
          console.warn('[reset] setSession threw:', err);
        }
      }

      // Nothing matched — surface diagnostic info so Sean can see what
      // landed in the URL bar.
      markHandledAndLock(
        'This page didn\'t receive a usable reset token. Request a new email from the Trade RC app and try once. If this keeps happening, the URL below shows what arrived.',
        true
      );
    }

    // Failsafe: if onAuthStateChange doesn't fire within 2.5 s, fall back.
    setTimeout(function () { if (!handled) tryManualFlows(); }, 2500);

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      clearStatus();

      const password = passwordInput.value;
      const confirm = confirmInput.value;

      if (password.length < 8) {
        showStatus('Password must be at least 8 characters.', 'error');
        return;
      }
      if (password !== confirm) {
        showStatus('Passwords do not match.', 'error');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Updating…';

      try {
        const { error } = await client.auth.updateUser({ password: password });
        if (error) {
          submitButton.disabled = false;
          submitButton.textContent = 'Update password';
          showStatus(error.message || 'Could not update password.', 'error');
          return;
        }
        passwordInput.disabled = true;
        confirmInput.disabled = true;
        ledeEl.textContent = 'Password updated successfully.';
        showStatus('Your password has been updated. Return to the Trade RC app and sign in.', 'success');
        submitButton.textContent = 'Done';
        // traderc:// is registered as a URL scheme in App-iOS Info.plist.
        // Tapping the link launches the iOS app; on desktop browsers it
        // gracefully no-ops, so the success message above still applies.
        returnLink.classList.remove('hidden');
      } catch (err) {
        submitButton.disabled = false;
        submitButton.textContent = 'Update password';
        showStatus(err.message || 'Unexpected error. Try again.', 'error');
      }
    });
  </script>
</body>
</html>
