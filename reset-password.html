<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset password — Trade RC</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #faf7f2;
      --surface: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #5b2a86;
      --accent-text: #ffffff;
      --error: #c8102e;
      --success: #006c2c;
      --border: #e0dcd5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --surface: #2c2c2e;
        --text: #f5f5f7;
        --text-secondary: #98989d;
        --accent: #b380e6;
        --accent-text: #1c1c1e;
        --border: #3a3a3c;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px;
      line-height: 1.4;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: 16px;
      padding: 32px 24px;
      border: 1px solid var(--border);
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p.lede {
      color: var(--text-secondary);
      margin: 0 0 24px;
      font-size: 15px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      margin-bottom: 16px;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      font-weight: 600;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      min-height: 50px;
      -webkit-appearance: none;
      appearance: none;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    a.return-link {
      display: block;
      margin-top: 16px;
      padding: 14px 16px;
      font-size: 17px;
      font-weight: 600;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      min-height: 50px;
      line-height: 22px;
    }
    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
    }
    .status.error {
      background: rgba(200, 16, 46, 0.1);
      color: var(--error);
    }
    .status.success {
      background: rgba(0, 108, 44, 0.1);
      color: var(--success);
    }
    .debug {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 11px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid var(--border);
    }
    .hidden { display: none; }
    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <p class="lede" id="lede">Validating reset link…</p>

    <form id="form" novalidate>
      <label for="password">New password</label>
      <input type="password" id="password" autocomplete="new-password" minlength="8" disabled required>

      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" autocomplete="new-password" minlength="8" disabled required>

      <button type="submit" id="submit" disabled>Update password</button>
    </form>

    <div id="status" class="status hidden" role="alert" aria-live="polite"></div>
    <a id="returnLink" href="traderc://" class="return-link hidden">Return to Trade RC</a>
    <pre id="debug" class="debug hidden"></pre>

    <footer>Thomas Ray Publishing LLC</footer>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://nzflkswaeqlciqvwvvug.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56Zmxrc3dhZXFsY2lxdnd2dnVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDI4NDUsImV4cCI6MjA5NDUxODg0NX0.QGrfTJaZLu1gFysjkc-04OnuErUu2gWmBIOwL8W16iM';

    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        detectSessionInUrl: true,
        persistSession: false,
        autoRefreshToken: false,
        flowType: 'implicit'
      }
    });

    const form = document.getElementById('form');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const submitButton = document.getElementById('submit');
    const statusEl = document.getElementById('status');
    const ledeEl = document.getElementById('lede');
    const debugEl = document.getElementById('debug');
    const returnLink = document.getElementById('returnLink');

    // Snapshot URL at load — detectSessionInUrl will scrub the auth params
    // after processing, so we need this for the fallback paths + diagnostic
    // info to remain useful.
    const urlAtLoad = window.location.href;
    const hashAtLoad = window.location.hash;
    const queryAtLoad = window.location.search;

    function showStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = 'status ' + kind;
    }

    function clearStatus() {
      statusEl.textContent = '';
      statusEl.className = 'status hidden';
    }

    function unlockForm() {
      passwordInput.disabled = false;
      confirmInput.disabled = false;
      submitButton.disabled = false;
      ledeEl.textContent = 'Enter a new password for your Trade RC account. Must be at least 8 characters.';
    }

    function lockWithReason(reason, showDebug) {
      passwordInput.disabled = true;
      confirmInput.disabled = true;
      submitButton.disabled = true;
      ledeEl.textContent = reason;
      if (showDebug) {
        debugEl.textContent =
          'URL on load:\n' + urlAtLoad +
          '\n\nHash: ' + (hashAtLoad || '(none)') +
          '\nQuery: ' + (queryAtLoad || '(none)');
        debugEl.classList.remove('hidden');
      }
    }

    let handled = false;

    function markHandledAndUnlock() {
      if (handled) return;
      handled = true;
      unlockForm();
      clearStatus();
    }

    function markHandledAndLock(reason, showDebug) {
      if (handled) return;
      handled = true;
      lockWithReason(reason, showDebug);
    }

    // The SDK with detectSessionInUrl: true will parse the URL and emit
    // either PASSWORD_RECOVERY (recovery link) or SIGNED_IN. If the URL
    // has no auth params, it emits INITIAL_SESSION with session=null.
    client.auth.onAuthStateChange(function (event, session) {
      console.log('[reset] auth event:', event, 'hasSession:', !!session);
      if (handled) return;
      if (event === 'PASSWORD_RECOVERY') {
        markHandledAndUnlock();
      } else if (event === 'SIGNED_IN' && session) {
        // Recovery session lands as SIGNED_IN in some SDK configs
        markHandledAndUnlock();
      } else if (event === 'INITIAL_SESSION' && !session) {
        // SDK saw no usable auth params in URL — try manual paths
        tryManualFlows();
      }
    });

    async function tryManualFlows() {
      if (handled) return;

      const hashParams = new URLSearchParams(hashAtLoad.substring(1));
      const queryParams = new URLSearchParams(queryAtLoad);

      const errorDescription =
        hashParams.get('error_description') || queryParams.get('error_description');
      if (errorDescription) {
        markHandledAndLock(
          'This reset link is invalid or has expired. Request a new one in the Trade RC app.',
          false
        );
        showStatus(decodeURIComponent(errorDescription), 'error');
        return;
      }

      // PKCE flow: ?code=...
      const code = queryParams.get('code');
      if (code) {
        try {
          const { error } = await client.auth.exchangeCodeForSession(code);
          if (!error) { markHandledAndUnlock(); return; }
          console.warn('[reset] exchangeCodeForSession failed:', error);
        } catch (err) {
          console.warn('[reset] exchangeCodeForSession threw:', err);
        }
      }

      // Implicit flow: #access_token=...
      const accessToken = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');
      if (accessToken) {
        try {
          const { error } = await client.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken || ''
          });
          if (!error) { markHandledAndUnlock(); return; }
          console.warn('[reset] setSession failed:', error);
        } catch (err) {
          console.warn('[reset] setSession threw:', err);
        }
      }

      // Nothing matched — surface diagnostic info so Sean can see what
      // landed in the URL bar.
      markHandledAndLock(
        'This page didn\'t receive a usable reset token. Request a new email from the Trade RC app and try once. If this keeps happening, the URL below shows what arrived.',
        true
      );
    }

    // Failsafe: if onAuthStateChange doesn't fire within 2.5 s, fall back.
    setTimeout(function () { if (!handled) tryManualFlows(); }, 2500);

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      clearStatus();

      const password = passwordInput.value;
      const confirm = confirmInput.value;

      if (password.length < 8) {
        showStatus('Password must be at least 8 characters.', 'error');
        return;
      }
      if (password !== confirm) {
        showStatus('Passwords do not match.', 'error');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Updating…';

      try {
        const { error } = await client.auth.updateUser({ password: password });
        if (error) {
          submitButton.disabled = false;
          submitButton.textContent = 'Update password';
          showStatus(error.message || 'Could not update password.', 'error');
          return;
        }
        passwordInput.disabled = true;
        confirmInput.disabled = true;
        ledeEl.textContent = 'Password updated successfully.';
        showStatus('Your password has been updated. Return to the Trade RC app and sign in.', 'success');
        submitButton.textContent = 'Done';
        // traderc:// is registered as a URL scheme in App-iOS Info.plist.
        // Tapping the link launches the iOS app; on desktop browsers it
        // gracefully no-ops, so the success message above still applies.
        returnLink.classList.remove('hidden');
      } catch (err) {
        submitButton.disabled = false;
        submitButton.textContent = 'Update password';
        showStatus(err.message || 'Unexpected error. Try again.', 'error');
      }
    });
  </script>
</body>
</html>
