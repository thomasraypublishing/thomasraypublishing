<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://nzflkswaeqlciqvwvvug.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Reset password — Trade RC</title>
  <meta name="theme-color" content="#1F0A28">
  <link rel="icon" type="image/png" href="trade-rc/images/icon.png">
  <link rel="apple-touch-icon" href="trade-rc/images/icon.png">
  <link rel="preload" href="assets/fonts/jetbrains-mono-normal-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-tight-normal-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="trade-rc/trade-rc.css">
  <style>
    .calm-main {
      max-width: 460px;
    }
    #reset-h {
      margin-bottom: 8px;
    }
    .lede {
      color: var(--trc-ink-2);
      margin: 0 0 28px;
      font-size: 0.9375rem;
    }
    #submit {
      width: 100%;
      margin-top: 4px;
    }
    #submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 4px;
      font-size: 0.875rem;
      font-family: var(--mono);
    }
    .status.error {
      background: rgba(255, 31, 143, 0.12);
      color: #FF9DCB;
      border: 1px solid rgba(255, 31, 143, 0.4);
    }
    .status.success {
      background: rgba(92, 184, 138, 0.12);
      color: var(--trc-sage);
      border: 1px solid rgba(92, 184, 138, 0.4);
    }
    .status.hidden {
      display: none;
    }
    .debug {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 4px;
      font-size: 0.6875rem;
      font-family: var(--mono);
      background: var(--trc-midnight);
      color: var(--trc-ink-2);
      border: 1px solid var(--trc-rule-mid);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .hidden {
      display: none;
    }
    a.return-link {
      display: block;
      margin-top: 16px;
      padding: 13px 16px;
      min-height: 48px;
      background: var(--trc-acid);
      color: var(--trc-btn-ink);
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.9375rem;
      text-align: center;
      text-decoration: none;
      border-radius: 4px;
      box-shadow: 0 0 24px var(--trc-acid-glow);
    }
    a.return-link:hover {
      background: #93FF82;
      color: var(--trc-btn-ink);
    }
    a.return-link.hidden {
      display: none;
    }
    #retry {
      width: 100%;
      margin-top: 16px;
    }
    #retry[hidden] {
      display: none;
    }
    .reset-foot {
      margin-top: 48px;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.03em;
      color: var(--trc-ink-2);
    }
  </style>
</head>
<body class="trc-calm">

<a class="skip-link" href="#reset-h">Skip to content</a>

<header class="mast">
  <a class="mark" href="trade-rc/index.html" aria-label="Trade RC home">
    <img src="trade-rc/images/icon.png" alt="" width="28" height="28">
    <span>Trade RC</span>
  </a>
</header>

<main class="calm-main" id="top">
  <h1 id="reset-h">Reset your password</h1>
  <p class="lede" id="lede" aria-live="polite">Checking your reset link…</p>
  <noscript>
    <style>#lede, #form { display: none; }</style>
    <p class="lede">JavaScript is turned off in this browser, so the reset link cannot be checked here. Turn it on and reload this page, or request a new link from the Trade RC app.</p>
  </noscript>

  <form id="form" novalidate class="trc-field">
    <label for="password">New password</label>
    <input type="password" id="password" autocomplete="new-password" minlength="8" disabled required>

    <label for="confirm">Confirm new password</label>
    <input type="password" id="confirm" autocomplete="new-password" minlength="8" disabled required>

    <button type="submit" id="submit" class="btn btn-acid" disabled>Update password</button>
  </form>

  <div id="status" class="status hidden" role="status"></div>
  <button type="button" id="retry" class="btn btn-ghost" hidden>Try again</button>
  <a id="returnLink" href="traderc://" class="return-link hidden">Return to Trade RC</a>
  <pre id="debug" class="debug hidden"></pre>

  <p class="reset-foot">Thomas Ray Publishing LLC</p>
</main>

<script src="assets/vendor/supabase-js-2.110.2.min.js"></script>
<script>
(function () {
  'use strict';

  const SUPABASE_URL = 'https://nzflkswaeqlciqvwvvug.supabase.co';
  // The anon key is a public client credential by design: it only grants
  // what the project's row-level security allows. It is not a secret.
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56Zmxrc3dhZXFsY2lxdnd2dnVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDI4NDUsImV4cCI6MjA5NDUxODg0NX0.QGrfTJaZLu1gFysjkc-04OnuErUu2gWmBIOwL8W16iM';

  const form = document.getElementById('form');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirm');
  const submitButton = document.getElementById('submit');
  const statusEl = document.getElementById('status');
  const ledeEl = document.getElementById('lede');
  const debugEl = document.getElementById('debug');
  const returnLink = document.getElementById('returnLink');
  const retryButton = document.getElementById('retry');

  /* Diagnostics policy. This page never renders, logs, or keeps the URL,
     its query or hash, any code or token, or a raw SDK error object. The
     panel below reports only which flow ran and a status category, which
     is enough to triage a broken link with support and nothing to leak.
     The SDK is told NOT to read the URL itself (detectSessionInUrl:false):
     its own cleanup would push a history entry that Back could restore
     with the tokens in it. This page reads the link once and scrubs it
     with replaceState, which leaves no history behind. */
  const diag = { library: 'missing', flow: 'none', outcome: 'pending', detail: '' };

  // Read the link's parameters exactly once.
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const queryParams = new URLSearchParams(window.location.search);
  const code = queryParams.get('code');
  const accessToken = hashParams.get('access_token') || queryParams.get('access_token');
  const refreshToken = hashParams.get('refresh_token') || queryParams.get('refresh_token') || '';
  const linkError = hashParams.get('error_code') || queryParams.get('error_code')
    || hashParams.get('error') || queryParams.get('error');
  const linkErrorDescribed = hashParams.has('error_description') || queryParams.has('error_description');
  // Anything at all in the query or hash counts as link material to scrub.
  const hadLinkParams = Boolean(window.location.search || window.location.hash);

  // Once the link has reached a final outcome, take its parameters out of the
  // address bar so a screenshot or a pasted URL no longer carries them. A
  // retryable outcome keeps them: the tokens live only in this page now.
  function scrubUrl() {
    if (!hadLinkParams || !window.history || !window.history.replaceState) { return; }
    try { window.history.replaceState(null, '', window.location.pathname); } catch (err) { /* nothing to do */ }
  }

  // Reduce a code or name to a safe token: lowercase letters, digits, underscores.
  const category = (value) => String(value || '').toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 40);

  // Status and code are categories, not credentials. The message and any
  // wrapped request or response never leave the SDK object.
  function describeError(error) {
    if (!error) { return 'unknown'; }
    const bits = [];
    if (typeof error.status === 'number') { bits.push('http_' + error.status); }
    if (error.code) { bits.push(category(error.code)); }
    if (!bits.length && error.name) { bits.push(category(error.name)); }
    return bits.join(' ') || 'unknown';
  }

  // The SDK wraps every fetch failure (including an aborted one) as
  // AuthRetryableFetchError with status 0; anything else is not the network.
  const isNetworkFailure = (error) => Boolean(error && (error.name === 'AuthRetryableFetchError' || error.status === 0));

  const MESSAGES = {
    checking: 'Checking your reset link…',
    expired: 'This reset link has expired. Request a new one in the Trade RC app.',
    invalid: 'This reset link is invalid. Request a new one in the Trade RC app.',
    rejected: 'This reset link was not accepted. It may have expired or already been used. Request a new one in the Trade RC app.',
    codeInBrowser: 'This link could not be completed in the browser. Open it on the device where you requested the reset, or request a new link in the Trade RC app.',
    noToken: 'This page did not receive a reset token. Open the link from the Trade RC email in this browser, or request a new email from the app.',
    unreachable: 'The sign-in service could not be reached. Check your connection and try again.',
    updateTimeout: 'The sign-in service did not answer in time. The password may still have been updated: try signing in with it in the Trade RC app before trying again here.',
    noLibrary: 'The page could not load its sign-in library. Reload this page to try again.',
    sessionEnded: 'This reset session has ended. Request a new link in the Trade RC app.',
    weak: 'That password does not meet the requirements. Try a longer one with more variety.',
    weakLength: 'That password is too short.',
    weakCharacters: 'Use a mix of letters, numbers and symbols.',
    weakPwned: 'That password has appeared in a known data breach. Choose a different one.',
    samePassword: 'Choose a password you have not used for this account before.',
    updateFailed: 'The password could not be changed from this page. Request a new link in the Trade RC app.'
  };

  function showStatus(message, kind) {
    statusEl.textContent = message;
    statusEl.className = 'status ' + kind;
  }

  function clearStatus() {
    statusEl.textContent = '';
    statusEl.className = 'status hidden';
  }

  function renderDiag() {
    debugEl.textContent = 'Link check: library ' + diag.library + ' / flow ' + diag.flow
      + ' / result ' + diag.outcome + (diag.detail ? ' (' + diag.detail + ')' : '');
    debugEl.classList.remove('hidden');
  }

  function unlockForm() {
    passwordInput.disabled = false;
    confirmInput.disabled = false;
    submitButton.disabled = false;
    retryButton.hidden = true;
    ledeEl.textContent = 'Enter a new password for your Trade RC account. Must be at least 8 characters.';
    if (document.activeElement === retryButton || document.activeElement === document.body) { passwordInput.focus(); }
  }

  function lockWithReason(reason, showDiag, retryable) {
    passwordInput.disabled = true;
    confirmInput.disabled = true;
    submitButton.disabled = true;
    ledeEl.textContent = reason;
    retryButton.hidden = !retryable;
    retryButton.disabled = false;
    if (showDiag) { renderDiag(); }
  }

  let handled = false;
  let started = false; // an exchange is in flight: the failsafe must not start a second one

  function markHandledAndUnlock() {
    if (handled) { return; }
    handled = true;
    diag.outcome = 'accepted';
    unlockForm();
    clearStatus();
    scrubUrl();
  }

  function markHandledAndLock(reason, showDiag, retryable) {
    if (handled) { return; }
    handled = true;
    lockWithReason(reason, showDiag, retryable);
    if (!retryable) { scrubUrl(); }
  }

  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    // Reloading is the only retry here, so the link stays in the bar.
    diag.outcome = 'no_library';
    markHandledAndLock(MESSAGES.noLibrary, true, true);
    retryButton.hidden = true;
    return;
  }
  diag.library = 'loaded';
  // Nothing needs the URL from here on (the tokens live in this script), so
  // scrub it now: a click on the skip link or the brand mark during the check
  // would otherwise leave the tokenised URL in history for Back to restore.
  scrubUrl();

  // No page-defined fetch wrapper for the SDK: the SDK logs raw fetch
  // failures with a stack trace, and a frame from this inline script would
  // carry the document's original URL, query included. A stalled request is
  // bounded by the outer withTimeout guard below instead.
  const SDK_TIMEOUT_MS = 15000;

  let client;
  try {
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        detectSessionInUrl: false,
        persistSession: false,
        autoRefreshToken: false,
        flowType: 'implicit'
      }
    });
  } catch (err) {
    diag.outcome = 'library_error';
    diag.detail = describeError(err);
    markHandledAndLock(MESSAGES.noLibrary, true, true);
    retryButton.hidden = true;
    return;
  }

  // The SDK never reads the URL, so a fresh load emits INITIAL_SESSION with
  // a null session and the page applies the link's tokens itself. A session
  // arriving by any route unlocks the form once.
  client.auth.onAuthStateChange(function (event, session) {
    if (handled) { return; }
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
      if (diag.flow === 'none') { diag.flow = 'link'; }
      markHandledAndUnlock();
    } else if (event === 'INITIAL_SESSION' && !session) {
      tryManualFlows();
    }
  });

  // Outer guard for anything the fetch ceiling cannot reach (a hung SDK
  // promise): the page never sits on "Checking…" for more than this.
  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      const timer = setTimeout(function () {
        const err = new Error('timeout'); err.name = 'AuthRetryableFetchError'; err.status = 0; err.timedOut = true; reject(err);
      }, ms || SDK_TIMEOUT_MS);
      promise.then(function (v) { clearTimeout(timer); resolve(v); }, function (e) { clearTimeout(timer); reject(e); });
    });
  }

  async function settle(run) {
    started = true;
    let error;
    try {
      const result = await withTimeout(Promise.resolve().then(run));
      error = result && result.error;
    } catch (err) {
      error = err;
    }
    if (handled) { return; }
    if (!error) { markHandledAndUnlock(); return; }
    const unreachable = isNetworkFailure(error);
    diag.outcome = unreachable ? 'unreachable' : 'rejected';
    diag.detail = describeError(error);
    console.warn('[reset] ' + diag.flow + ' ' + diag.outcome + ' ' + diag.detail);
    if (unreachable) {
      markHandledAndLock(MESSAGES.unreachable, true, true);
    } else {
      markHandledAndLock(diag.flow === 'code' ? MESSAGES.codeInBrowser : MESSAGES.rejected, true, false);
    }
  }

  function tryManualFlows() {
    if (handled || started) { return; }

    // The provider reported an error in the link itself. Show fixed copy for
    // the category; never echo the link's own text onto this page.
    if (linkError || linkErrorDescribed) {
      diag.flow = 'error_link';
      diag.outcome = category(linkError) || 'error';
      const expired = diag.outcome === 'otp_expired';
      markHandledAndLock(expired ? MESSAGES.expired : MESSAGES.invalid, false, false);
      showStatus(expired ? 'Link expired.' : 'Link not valid.', 'error');
      return;
    }

    // PKCE flow: ?code=. A browser page cannot hold the app's code verifier,
    // so this only succeeds when the link was issued for a browser session.
    if (code) {
      diag.flow = 'code';
      settle(() => client.auth.exchangeCodeForSession(code));
      return;
    }

    // Implicit flow: #access_token= (this page applies it; the SDK does not).
    if (accessToken) {
      diag.flow = 'token';
      settle(() => client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken }));
      return;
    }

    diag.flow = 'none';
    diag.outcome = 'no_token';
    markHandledAndLock(MESSAGES.noToken, true, false);
  }

  // Try again after an unreachable outcome: the tokens are still in memory.
  retryButton.addEventListener('click', function () {
    if (diag.outcome !== 'unreachable') { return; }
    handled = false;
    started = false;
    diag.outcome = 'pending';
    diag.detail = '';
    retryButton.disabled = true; // stays visible, keeps focus, until the outcome
    debugEl.classList.add('hidden');
    ledeEl.textContent = MESSAGES.checking;
    tryManualFlows();
  });

  // The skip link is a same-document navigation; keep it from writing a
  // history entry even in the instant before the scrub above ran.
  const skipLink = document.querySelector('.skip-link');
  const heading = document.getElementById('reset-h');
  if (skipLink && heading) {
    skipLink.addEventListener('click', function (event) {
      event.preventDefault();
      heading.setAttribute('tabindex', '-1');
      heading.focus();
    });
  }

  // Failsafe: if onAuthStateChange never fires, fall back after 2.5 s.
  setTimeout(function () { if (!handled && !started) { tryManualFlows(); } }, 2500);

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    clearStatus();

    const password = passwordInput.value;
    const confirm = confirmInput.value;

    if (password.length < 8) {
      showStatus('Password must be at least 8 characters.', 'error');
      return;
    }
    if (password !== confirm) {
      showStatus('Passwords do not match.', 'error');
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = 'Updating…';

    let error;
    try {
      const result = await withTimeout(client.auth.updateUser({ password: password }), 30000);
      error = result && result.error;
    } catch (err) {
      error = err;
    }

    if (error) {
      submitButton.disabled = false;
      submitButton.textContent = 'Update password';
      console.warn('[reset] update failed ' + describeError(error));
      // Fixed copy per category. The provider's own text never reaches the page.
      const kind = category(error.code || (error.name === 'AuthSessionMissingError' ? 'session_missing' : ''));
      if (error.timedOut) {
        // The request may have completed after we stopped waiting.
        showStatus(MESSAGES.updateTimeout, 'error');
      } else if (isNetworkFailure(error)) {
        showStatus(MESSAGES.unreachable, 'error');
      } else if (kind === 'weak_password') {
        const reasons = Array.isArray(error.reasons) ? error.reasons : [];
        const bits = [];
        if (reasons.indexOf('length') !== -1) { bits.push(MESSAGES.weakLength); }
        if (reasons.indexOf('characters') !== -1) { bits.push(MESSAGES.weakCharacters); }
        if (reasons.indexOf('pwned') !== -1) { bits.push(MESSAGES.weakPwned); }
        showStatus(bits.length ? bits.join(' ') : MESSAGES.weak, 'error');
      } else if (kind === 'same_password') {
        showStatus(MESSAGES.samePassword, 'error');
      } else if (['session_missing', 'session_not_found', 'session_expired', 'refresh_token_not_found', 'bad_jwt', 'user_not_found'].indexOf(kind) !== -1) {
        lockWithReason(MESSAGES.sessionEnded, false, false);
        showStatus('Link expired.', 'error');
        scrubUrl();
      } else {
        showStatus(MESSAGES.updateFailed, 'error');
      }
      return;
    }

    passwordInput.disabled = true;
    confirmInput.disabled = true;
    ledeEl.textContent = 'Password updated successfully.';
    showStatus('Your password has been updated. Return to the Trade RC app and sign in.', 'success');
    submitButton.textContent = 'Done';
    scrubUrl();
    // traderc:// is registered as a URL scheme in App-iOS Info.plist.
    // Tapping the link launches the iOS app; on desktop browsers it
    // gracefully no-ops, so the success message above still applies.
    returnLink.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
